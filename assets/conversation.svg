        <text x="30" y="31" class="sans" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">gh</text>
        <text x="65" y="32" class="sans" font-size="13" font-weight="700" fill="#F5F2F0">Follow @prak05 on GitHub</text>
