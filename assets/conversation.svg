<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="100%" height="100%">
  <defs>
    <radialGradient id="convGlow" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FF002D" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#74121F" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1b1b1b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Space Mono', 'Courier New', monospace; }
    .sans { font-family: 'Inter', 'Outfit', system-ui, -apple-system, sans-serif; }
    .headline { font-family: 'Anton', 'Bebas Neue', 'Impact', sans-serif; letter-spacing: 4px; }
  </style>

  <rect width="1100" height="360" rx="16" fill="#1b1b1b" stroke="#393434" stroke-width="1.5" />
  <rect width="1100" height="360" rx="16" fill="url(#convGlow)" />

  <text x="45" y="45" class="mono" font-size="11" font-weight="700" fill="#FF002D" letter-spacing="2">05 / START A CONVERSATION</text>
  <text x="1055" y="45" text-anchor="end" class="mono" font-size="16" fill="#FF002D">///</text>

